<style>
  :root{
    color-scheme:light dark;
    --ground:#F1F4F1; --surface:#FFFFFF; --ink:#15211B; --ink-2:#4E6158; --ink-3:#7C8F85;
    --line:#D3DCD6; --line-strong:#B6C4BC; --sign:#00603F; --sign-ink:#FFFFFF;
    --accent:#00623E; --live:#C33A22;
    --font-jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --font-num:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0E1512; --surface:#161F1B; --ink:#E7EDE9; --ink-2:#A3B4AB; --ink-3:#7C8F85;
      --line:#293630; --line-strong:#3A4A43; --sign:#0B4D34; --sign-ink:#EAF4EE;
      --accent:#4CC291; --live:#F0734F;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:var(--font-jp);font-size:15px;line-height:1.7;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));
    -webkit-font-smoothing:antialiased;
  }
  .card{width:100%;max-width:400px}
  .sign{
    background:var(--sign);color:var(--sign-ink);border:3px solid var(--sign-ink);
    border-radius:4px;padding:18px 16px 16px;
    box-shadow:0 1px 2px rgba(21,33,27,.06),0 10px 30px -18px rgba(21,33,27,.6);
  }
  .sign .eyebrow{
    display:block;font-family:var(--font-num);font-size:10px;
    letter-spacing:.18em;text-transform:uppercase;opacity:.85;
  }
  .sign h1{margin:6px 0 0;font-size:26px;font-weight:900;letter-spacing:.02em;line-height:1.25}
  .sign p{margin:4px 0 0;font-size:12.5px;font-weight:500;opacity:.9}
  form{margin-top:16px;display:grid;gap:10px}
  label{font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--ink-2)}
  input{
    width:100%;font-family:var(--font-jp);font-size:16px;
    padding:11px 13px;border:1px solid var(--line-strong);border-radius:8px;
    background:var(--surface);color:var(--ink);
  }
  input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  button{
    font-family:var(--font-jp);font-size:15px;font-weight:700;
    padding:11px 14px;border:none;border-radius:8px;cursor:pointer;
    background:var(--sign);color:var(--sign-ink);
  }
  button:disabled{opacity:.6;cursor:progress}
  .msg{min-height:20px;font-size:12.5px;color:var(--live);font-weight:700}
  .msg.busy{color:var(--ink-3);font-weight:500}
  .hint{margin-top:12px;font-size:11.5px;color:var(--ink-3);line-height:1.7}
  noscript{display:block;margin-top:12px;font-size:12.5px;color:var(--live);font-weight:700}
</style>
</head>
<body>
  <main class="card">
    <div class="sign">
      <span class="eyebrow">ZUTOMAYO / NARA HEIJO-KYO 2026</span>
      <h1>文禍伝雷 遠征しおり</h1>
      <p>合言葉を入れるとしおりが開きます</p>
    </div>
    <form id="gate" autocomplete="off">
      <label for="pw">合言葉</label>
      <input id="pw" name="pw" type="password" inputmode="latin" autocomplete="current-password" autofocus>
      <button id="go" type="submit">開く</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
    <p class="hint">しおり本体は暗号化された状態で送られており、合言葉なしでは中身を読めません。タブを閉じるまでは再入力不要です。</p>

      .then(function(base){
        return crypto.subtle.deriveKey(
          { name:"PBKDF2", salt:b64(data.s), iterations:data.it, hash:"SHA-256" },
          base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      })
      .then(function(key){
        return crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(data.iv) }, key, b64(data.ct));
      })
      .then(function(buf){
        var html = new TextDecoder().decode(buf);
        try { sessionStorage.setItem(KEY, pass); } catch (e) {}
        document.open(); document.write(html); document.close();
        return true;
      })
      .catch(function(){
        go.disabled = false;
        msg.className = "msg";
        msg.textContent = silent ? "" : "合言葉が違います。";
        if (silent) { try { sessionStorage.removeItem(KEY); } catch (e) {} }
        pw.select();
        return false;
      });
  }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    if (!pw.value) { msg.className="msg"; msg.textContent="合言葉を入力してください。"; return; }
    unlock(pw.value, false);
  });

  var remembered = null;
  try { remembered = sessionStorage.getItem(KEY); } catch (e) {}
  if (remembered) unlock(remembered, true);
})();
</script>
</body>
</html>
